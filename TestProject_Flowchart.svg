<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
    .box { fill: #f7f7f7; stroke: #333; stroke-width: 2; rx: 8; ry: 8; }
    .title { font: 700 20px Arial, sans-serif; fill: #111; }
    .text { font: 16px Arial, sans-serif; fill: #111; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="40" y="40" class="title">TestProject Automation Flow</text>

  <rect class="box" x="60" y="80" width="520" height="60" />
  <text class="text" x="80" y="115">Start: Gradle or Jenkins triggers test run</text>

  <rect class="box" x="60" y="170" width="520" height="60" />
  <text class="text" x="80" y="205">Runner: TestNGRunner or TestRunner</text>

  <rect class="box" x="60" y="260" width="520" height="60" />
  <text class="text" x="80" y="295">Cucumber loads Features and Step Definitions</text>

  <rect class="box" x="60" y="350" width="520" height="60" />
  <text class="text" x="80" y="385">Hooks: setup WebDriver via DriverFactory</text>

  <rect class="box" x="60" y="440" width="520" height="60" />
  <text class="text" x="80" y="475">Step Definitions call Page Objects</text>

  <rect class="box" x="60" y="530" width="520" height="60" />
  <text class="text" x="80" y="565">Selenium drives browser actions</text>

  <rect class="box" x="60" y="620" width="520" height="60" />
  <text class="text" x="80" y="655">Assertions validate expected outcomes</text>

  <rect class="box" x="60" y="710" width="520" height="60" />
  <text class="text" x="80" y="745">Reports and Logs generated</text>

  <rect class="box" x="60" y="800" width="520" height="60" />
  <text class="text" x="80" y="835">End</text>

  <path class="arrow" d="M320 140 L320 170" />
  <path class="arrow" d="M320 230 L320 260" />
  <path class="arrow" d="M320 320 L320 350" />
  <path class="arrow" d="M320 410 L320 440" />
  <path class="arrow" d="M320 500 L320 530" />
  <path class="arrow" d="M320 590 L320 620" />
  <path class="arrow" d="M320 680 L320 710" />
  <path class="arrow" d="M320 770 L320 800" />
</svg>
