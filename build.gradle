plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}
test {
    useJUnit()

    maxParallelForks = 2
}

dependencies {
    // Selenium
    implementation 'org.seleniumhq.selenium:selenium-java:4.18.1'
    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.15.0'
    testImplementation 'io.cucumber:cucumber-junit:7.15.0'
    testImplementation 'io.cucumber:cucumber-testng:7.15.0'
    // JUnit
    testImplementation 'junit:junit:4.13.2'
    // TestNG
    testImplementation 'org.testng:testng:7.10.2'
    //Web Driver Manager
    implementation 'io.github.bonigarcia:webdrivermanager:5.7.0'
    //Extent Reports
    testImplementation 'tech.grasshopper:extentreports-cucumber7-adapter:1.7.0'
    //Log4j
    implementation 'org.apache.logging.log4j:log4j-api:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.22.1'
}

test {
    useJUnitPlatform()
}

tasks.register('testNG', Test) {
    description = 'Runs TestNG-based tests.'
    group = 'verification'
    useTestNG()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/TestNGRunner.class'
}
